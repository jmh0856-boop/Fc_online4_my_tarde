<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FC Online 거래내역</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >
</head>

<body>

    <main class="container">

        <header class="page-header">
            <h1>FC Online 거래내역</h1>
            <p>구매 / 판매 거래내역을 확인하세요.</p>
        </header>


        <!-- 닉네임 검색 -->
        <section class="search-box">

            <input
                type="text"
                id="nickname"
                placeholder="FC Online 닉네임을 입력하세요"
            >

            <button id="search-button">
                조회
            </button>

        </section>


        <!-- 거래 종류 -->
        <nav class="trade-tabs">

            <button
                class="trade-tab active"
                data-type="all"
            >
                전체
            </button>

            <button
                class="trade-tab"
                data-type="buy"
            >
                구매
            </button>

            <button
                class="trade-tab"
                data-type="sell"
            >
                판매
            </button>

        </nav>


        <!-- 상태 -->
        <div id="status"></div>


        <!-- 거래 목록 -->
        <section id="trade-list"></section>


        <!-- 페이지네이션 -->
        <nav
            id="pagination"
            class="pagination"
        ></nav>

    </main>


    <script
        src="{{ url_for('static', path='js/app.js') }}"
    ></script>

</body>
</html>
